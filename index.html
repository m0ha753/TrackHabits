<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-title" content="Habitudes"/>
<meta charset="UTF-8"/>
<title>TrackHabits</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{overscroll-behavior:none; -webkit-user-select: none;}
  @keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes popIn{0%{opacity:0;transform:scale(.6) translateY(14px)}65%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .habit-new{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
  .page{animation:fadeUp .28s ease both}
  input,select,textarea{-webkit-appearance:none; outline:none;}
  ::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

const K={habits:"ht5-habits",logs:"ht5-logs",moods:"ht5-moods",theme:"ht5-theme"};
const store={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const THEMES={
  organic:{id:"organic",label:"🌿 Organic",bg:"#f5f0eb",card:"#fffdf9",border:"#e8e0d5",text:"#2c2416",sub:"#8a7a6a",muted:"#b5a898",accent:"#7c9e6e",tab:"#fffdf9",tabBorder:"#e8e0d5",header:"#fffdf9",font:"'Fraunces',serif",ui:"'DM Sans',sans-serif",dark:false},
  nebula:{id:"nebula",label:"🌌 Nebula",bg:"#0d0d14",card:"#14141f",border:"#22223a",text:"#e8e4ff",sub:"#7070aa",muted:"#3a3a5a",accent:"#9b7cff",tab:"#14141f",tabBorder:"#22223a",header:"#14141f",font:"'Space Grotesk',sans-serif",ui:"'Space Grotesk',sans-serif",dark:true},
  neon:{id:"neon",label:"⚡ Neon",bg:"#0a0a0a",card:"#111111",border:"#1f1f1f",text:"#f0f0f0",sub:"#666666",muted:"#333333",accent:"#00ff88",tab:"#111111",tabBorder:"#1f1f1f",header:"#111111",font:"'Syne',sans-serif",ui:"'Syne',sans-serif",dark:true},
};

const HABIT_COLORS=["#f472b6","#a78bfa","#60a5fa","#34d399","#facc15","#fb923c","#f87171","#22d3ee"];
const MOODS=[{emoji:"😔",label:"Difficile",color:"#f87171"},{emoji:"😐",label:"Moyen",color:"#fb923c"},{emoji:"🙂",label:"Bien",color:"#facc15"},{emoji:"😊",label:"Super",color:"#4ade80"},{emoji:"🤩",label:"Incroyable",color:"#f472b6"}];
const UNITS=["L","ml","h","min","km","m","fois","pages","kcal","€",""];
const DAYS_FR=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS_FULL=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const today=()=>new Date().toISOString().split("T")[0];
const shift=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().split("T")[0];};
const scheduled=(h,d)=>h.frequency==="daily"?true:true;
const scoreColor=p=>p>=80?"#4ade80":p>=45?"#facc15":"#f87171";

function streak(hab,logs){
  let s=0;
  for(let i=0;i<365;i++){const d=shift(today(),-i);if((logs[d]?.[hab.id]||0)>=100)s++;else break;}
  return s;
}

const fmtProgress=(hab,pct)=>{
  if(!hab.goalQty) return null;
  const cur = (pct/100) * hab.goalQty;
  // Si unité "fois", on affiche sans décimales
  const displayCur = hab.goalUnit === "fois" ? Math.round(cur) : Math.round(cur * 10) / 10;
  return `${displayCur}${hab.goalUnit} / ${hab.goalQty}${hab.goalUnit}`;
};

function Ring({pct=0,color,size=48,stroke=4,t}){
  const r=(size-stroke*2)/2,c=2*Math.PI*r;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={t.muted} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${(pct/100)*c} ${c}`} strokeLinecap="round" style={{transition:"stroke-dasharray .4s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {pct>0&&<span style={{fontSize:size*0.22,fontWeight:700,color,fontFamily:"monospace"}}>{pct===100?"✓":`${pct}`}</span>}
      </div>
    </div>
  );
}

function Modal({visible,onClose,t,children}){
  if(!visible)return null;
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"#00000099",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:t.card,borderRadius:"24px 24px 0 0",padding:"22px 20px 48px",width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",borderTop:`1px solid ${t.border}`,color:t.text}}>
        {children}
      </div>
    </div>
  );
}

function Toast({msg,color}){
  return <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:color,color:"#fff",padding:"10px 22px",borderRadius:30,fontWeight:700,fontSize:14,zIndex:9999,animation:"toastPop .35s cubic-bezier(.34,1.56,.64,1)"}}>{msg}</div>;
}

/* ─── SWIPE CARD AMÉLIORÉE ─── */
function SwipeCard({hab,pct,onPct,onEdit,t}){
  const ref=useRef();
  const dragging=useRef(false);
  const startX=useRef(0);
  const hasMovedSignificant=useRef(false);
  const [showInput, setShowInput] = useState(false);
  const [tempVal, setTempVal] = useState("");

  const apply=clientX=>{
    const rect=ref.current?.getBoundingClientRect();
    if(!rect)return;
    let newPct = Math.round(((clientX-rect.left)/rect.width)*100/5)*5;
    
    // Optimisation "fois" : On cale la progression sur des nombres entiers si l'unité est "fois"
    if(hab.goalQty && hab.goalUnit === "fois") {
        const curValue = Math.round((newPct/100) * hab.goalQty);
        newPct = (curValue / hab.goalQty) * 100;
    }

    onPct(Math.max(0, Math.min(100, newPct)));
  };

  const onPD=e=>{
    dragging.current=true;
    startX.current=e.clientX;
    hasMovedSignificant.current=false;
    ref.current?.setPointerCapture(e.pointerId);
  };

  const onPM=e=>{
    if(!dragging.current) return;
    if(!hasMovedSignificant.current && Math.abs(e.clientX-startX.current) > 15) {
        hasMovedSignificant.current = true;
    }
    if(hasMovedSignificant.current) apply(e.clientX);
  };

  const onPU=e=>{
    dragging.current=false;
    ref.current?.releasePointerCapture(e.pointerId);
  };

  const handleInputBlur = () => {
    if(tempVal !== "") {
        let val = parseFloat(tempVal);
        if(hab.goalQty) {
            let p = (val / hab.goalQty) * 100;
            onPct(Math.max(0, Math.min(100, p)));
        } else {
            onPct(val >= 1 ? 100 : 0);
        }
    }
    setShowInput(false);
    setTempVal("");
  };

  const prog=fmtProgress(hab,pct);

  return(
    <div style={{marginBottom:10}}>
        <div ref={ref} onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} style={{position:"relative",borderRadius:18,overflow:"hidden",background:t.card,border:`1.5px solid ${pct===100?hab.color+"66":t.border}`,cursor:"ew-resize",userSelect:"none",touchAction:"pan-y"}}>
        <div style={{position:"absolute",inset:0,width:`${pct}%`,background:`linear-gradient(90deg,${hab.color}25,${hab.color}10)`,transition:hasMovedSignificant.current?"none":"width .3s",pointerEvents:"none"}}/>
        <div style={{position:"relative",padding:"14px 16px",display:"flex",alignItems:"center",gap:14,pointerEvents:"none"}}>
            <div onClick={(e)=>{e.stopPropagation(); onPct(pct===100?0:100);}} style={{pointerEvents:"all"}}>
                <Ring pct={pct} color={pct>0?hab.color:t.muted} size={42} stroke={3.5} t={t}/>
            </div>
            
            <div onClick={() => setShowInput(true)} style={{flex:1, minWidth:0, pointerEvents:"all"}}>
            {showInput ? (
                <input 
                    autoFocus 
                    type="number" 
                    placeholder="Valeur..."
                    value={tempVal}
                    onChange={e => setTempVal(e.target.value)}
                    onBlur={handleInputBlur}
                    onKeyDown={e => e.key === 'Enter' && handleInputBlur()}
                    style={{background:'none', border:'none', color:t.text, fontSize:15, fontWeight:700, width:'100%'}}
                />
            ) : (
                <>
                <div style={{fontWeight:700,fontSize:15,color:pct===100?hab.color:t.text}}>{hab.name}</div>
                <div style={{fontSize:12,color:t.sub,marginTop:3}}>
                    {prog ? <span style={{color:pct>0?hab.color:t.sub}}>{prog}</span> : pct===100 ? <span style={{color:hab.color}}>✓ Terminé !</span> : pct>0 ? <span style={{color:hab.color}}>{pct}%</span> : <span>← Glisse pour avancer</span>}
                </div>
                </>
            )}
            </div>

            <button onClick={(e)=>{e.stopPropagation(); onEdit();}} style={{pointerEvents:"all",background:"none",border:"none",color:t.sub,fontSize:16}}>✎</button>
        </div>
        </div>
    </div>
  );
}

/* ─── FORMULAIRE ─── */
function HabitForm({hab,onSave,onDelete,onClose,t}){
  const[name,setName]=useState(hab?.name||"");
  const[emoji,setEmoji]=useState(hab?.emoji||"🏃");
  const[color,setColor]=useState(hab?.color||HABIT_COLORS[0]);
  const[qty,setQty]=useState(hab?.goalQty||1);
  const[unit,setUnit]=useState(hab?.goalUnit||"fois");
  const[isMeas,setIsMeas]=useState(!!hab?.goalQty);

  const save=()=>name.trim()&&onSave({name:name.trim(),emoji,color,frequency:"daily",goalQty:isMeas?Number(qty):null,goalUnit:isMeas?unit:""});
  const inp={width:"100%",padding:"12px",borderRadius:10,border:`1px solid ${t.border}`,background:t.bg,color:t.text,marginBottom:15};

  return(
    <>
      <h2 style={{margin:"0 0 20px"}}>{hab?"Modifier":"Nouvelle habitude"}</h2>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Nom" style={inp}/>
      <input value={emoji} onChange={e=>setEmoji(e.target.value)} placeholder="Emoji" style={inp}/>
      
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:15}}>
        <input type="checkbox" checked={isMeas} onChange={e=>setIsMeas(e.target.checked)} id="meas"/>
        <label htmlFor="meas" style={{fontSize:14}}>Objectif chiffré</label>
      </div>

      {isMeas && (
          <div style={{display:"flex", gap:10}}>
              <input type="number" value={qty} onChange={e=>setQty(e.target.value)} style={{...inp, flex:1}} placeholder="Qté"/>
              <select value={unit} onChange={e=>setUnit(e.target.value)} style={{...inp, flex:1}}>
                  {UNITS.map(u=><option key={u} value={u}>{u||"Unité"}</option>)}
              </select>
          </div>
      )}

      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {HABIT_COLORS.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:30,height:30,borderRadius:"50%",background:c,border:color===c?`3.3px solid #fff`:"none"}}/>)}
      </div>
      <button onClick={save} style={{width:"100%",padding:14,background:color,color:"#fff",border:"none",borderRadius:12,fontWeight:700}}>Enregistrer</button>
      {hab&&<button onClick={()=>onDelete(hab.id)} style={{width:"100%",marginTop:10,background:"none",color:"#f87171",border:"none"}}>Supprimer</button>}
    </>
  );
}

function App(){
  const[habits,setHabits]=useState(store.get(K.habits)||[]);
  const[logs,setLogs]=useState(store.get(K.logs)||{});
  const[themeId,setThemeId]=useState(store.get(K.theme)||"nebula");
  const[showForm,setShowForm]=useState(false);
  const[editHab,setEditHab]=useState(null);
  const[toast,setToast]=useState(null);
  
  const t=THEMES[themeId];
  const td=today();

  const pop=(msg,color)=>{setToast({msg,color});setTimeout(()=>setToast(null),2000);};

  const handlePct=(id,val)=>{
    const nl={...logs,[td]:{...(logs[td]||{}),[id]:val}};
    setLogs(nl);store.set(K.logs,nl);
  };

  const handleSave=h=>{
    const upd=editHab?habits.map(x=>x.id===editHab.id?{...x,...h}:x):[...habits,{id:Date.now().toString(),...h}];
    setHabits(upd);store.set(K.habits,upd);
    setShowForm(false);setEditHab(null);
    pop("C'est fait !",h.color);
  };

  return(
    <div style={{background:t.bg,minHeight:"100vh",color:t.text,paddingBottom:80}}>
      {toast&&<Toast msg={toast.msg} color={toast.color}/>}
      <div style={{padding:"20px 20px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{margin:0,fontSize:24}}>Mes Habitudes</h1>
        <button onClick={()=>setThemeId(themeId==="nebula"?"organic":"nebula")} style={{background:t.card,border:"none",padding:8,borderRadius:10}}>{themeId==="nebula"?"🌿":"🌌"}</button>
      </div>
      <div style={{padding:20}}>
        {habits.map(h=><SwipeCard key={h.id} hab={h} pct={logs[td]?.[h.id]||0} onPct={p=>handlePct(h.id,p)} onEdit={()=>{setEditHab(h);setShowForm(true);}} t={t}/>)}
        <button onClick={()=>{setEditHab(null);setShowForm(true);}} style={{width:"100%",padding:15,marginTop:10,background:t.accent,color:"#fff",border:"none",borderRadius:15,fontWeight:700}}>+ Ajouter</button>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
