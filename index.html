    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('SW ok')).catch(e => console.log('SW err', e));

  <style>
    body { font-family: 'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important; overscroll-behavior:none; margin:0; padding:0; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    ::-webkit-scrollbar { display:none; }
    @keyframes toastPop { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes popIn { 0%{opacity:0;transform:scale(.6) translateY(14px)} 65%{transform:scale(1.07)} 100%{opacity:1;transform:scale(1)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes flamePulseSmall { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes flamePulseBig { 0%,100%{transform:scale(1) rotate(-2deg)} 50%{transform:scale(1.12) rotate(2deg)} }
    @keyframes streakOverlayIn { from{opacity:0} to{opacity:1} }
    @keyframes streakFlameIn { 0%{opacity:0;transform:scale(0.3) translateY(40px)} 60%{transform:scale(1.15) translateY(-8px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
    @keyframes streakNumPop { 0%{opacity:0;transform:scale(0.5)} 70%{transform:scale(1.2)} 100%{opacity:1;transform:scale(1)} }
    @keyframes streakOut { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(0.7)} }
    @keyframes inputSlideIn { from{opacity:0;transform:scaleX(0.92)} to{opacity:1;transform:scaleX(1)} }

    /* ── Sakura petals ── */
    @keyframes petalFall {
      0%   { transform: translateY(-60px) translateX(0px) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
    }
    .petal {
      position: fixed; pointer-events: none; z-index: 0;
      width: var(--size); height: var(--size);
      border-radius: 50% 0 50% 0;
      background: var(--color);
      animation: petalFall var(--dur) var(--delay) linear infinite;
      left: var(--left); top: -60px;
      opacity: 0;
    }

    /* ── Dusk stars ── */
    @keyframes twinkle {
      0%,100% { opacity: var(--base-op); transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.4); }
    }
    .star {
      position: fixed; pointer-events: none; z-index: 0;
      width: var(--sz); height: var(--sz);
      border-radius: 50%;
      background: var(--col);
      left: var(--x); top: var(--y);
      animation: twinkle var(--dur) var(--delay) ease-in-out infinite;
      opacity: var(--base-op);
    }

    /* ── Sepia dust ── */
    @keyframes dustFloat {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      20%  { opacity: var(--op); }
      80%  { opacity: var(--op); }
      100% { transform: translateY(var(--dy)) translateX(var(--dx)) scale(var(--sc)); opacity: 0; }
    }
    .dust {
      position: fixed; pointer-events: none; z-index: 0;
      width: var(--sz); height: var(--sz);
      border-radius: 50%;
      background: var(--col);
      left: var(--x); top: var(--y);
      animation: dustFloat var(--dur) var(--delay) ease-in-out infinite;
      opacity: 0;
    }

    .habit-new { animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both }
    .page { animation:fadeUp .28s ease both }
    input,select,textarea { -webkit-appearance:none; }
    .flame-small { animation: flamePulseSmall 2.4s ease-in-out infinite; transform-origin: 50% 85%; display:inline-block; }
    .flame-big { animation: flamePulseBig 1.8s ease-in-out infinite; transform-origin: 50% 85%; }
    .streak-overlay { animation: streakOverlayIn 0.3s ease both; }
    .streak-overlay.out { animation: streakOut 0.4s ease both; }
    .streak-flame-enter { animation: streakFlameIn 0.7s cubic-bezier(.34,1.56,.64,1) both; }
    .streak-num-pop { animation: streakNumPop 0.5s cubic-bezier(.34,1.56,.64,1) both; }
    .input-slide-in { animation: inputSlideIn 0.18s cubic-bezier(.34,1.2,.64,1) both; }
  </style>

const MONTHS_FULL=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const UNITS=["L","ml","h","min","km","m","fois","pages","verres","kcal","€",""];
const UNIT_INTEGER=["fois","pages","verres","h","min","ml","m","kcal"];

const today=()=>new Date().toISOString().split("T")[0];
const dow=d=>(new Date(d+"T12:00:00").getDay()+6)%7;
const shift=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().split("T")[0];};
const scheduled=(h,d)=>h.frequency==="daily"?true:h.frequency==="weekly"?(h.days||[]).includes(dow(d)):true;

function streak(hab,logs){
  let s=0;
  for(let i=0;i<365;i++){const d=shift(today(),-i);if(!scheduled(hab,d))continue;if((logs[d]?.[hab.id]||0)>=100)s++;else break;}
  return s;
}

const dayScore=(habits,logs,d)=>{const sc=habits.filter(h=>scheduled(h,d));if(!sc.length)return null;return Math.round(sc.reduce((a,h)=>a+Math.min(logs[d]?.[h.id]||0,100),0)/sc.length);};
const fmtProgress=(hab,pct)=>{
  if(!hab.goalQty||hab.goalUnit===undefined)return null;
  const cur=Math.round((pct/100)*hab.goalQty*10)/10;
  return`${cur}${hab.goalUnit} / ${hab.goalQty}${hab.goalUnit}`;
};
function snapPct(rawPct,hab){
  if(!hab.goalQty)return rawPct>=50?100:0;
  const u=hab.goalUnit,qty=hab.goalQty;
  if(UNIT_INTEGER.includes(u)){const step=100/qty;return Math.max(0,Math.min(100,Math.round(rawPct/step)*step));}
  const step=10/qty;return Math.max(0,Math.min(100,Math.round(rawPct/step)*step));
}

    </svg>

function FlameStreak({masterStreak,T}){
  const fc=T.flame||"#e87030";
  const isHot=masterStreak>=7,isFire=masterStreak>=30;
  const innerC=isFire?"rgba(255,255,180,0.85)":isHot?"rgba(255,220,120,0.7)":"rgba(255,190,80,0.6)";
  return(
    <div style={{display:"flex",alignItems:"center",gap:3,padding:"2px 8px 2px 4px",borderRadius:20,background:masterStreak>0?`${fc}18`:"transparent",border:`1px solid ${masterStreak>0?fc+"30":T.muted}`,transition:"all .3s"}}>
      <div className="flame-small" style={{display:"flex",alignItems:"center"}}>
        <FlameSVG size={20} color={fc} innerColor={innerC}/>
      </div>
      <span style={{fontSize:13,fontWeight:700,color:masterStreak>0?fc:T.sub,letterSpacing:"-0.5px",lineHeight:1,fontFamily:"'DM Sans',monospace"}}>
        {masterStreak}
      </span>
    </div>
  );
}

function StreakCelebration({newStreak,onDone,T}){
  const fc=T.flame||"#ff7030";
  const [phase,setPhase]=useState("enter");
  const [displayNum,setDisplayNum]=useState(newStreak-1);
  const [numKey,setNumKey]=useState(0);
  const innerC="rgba(255,255,180,0.85)";
  useEffect(()=>{
    const t1=setTimeout(()=>{setDisplayNum(newStreak);setNumKey(k=>k+1);},1100);
    const t2=setTimeout(()=>{setPhase("exit");setTimeout(onDone,400);},2800);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);
  return(
    <div className={`streak-overlay${phase==="exit"?" out":""}`} onClick={()=>{setPhase("exit");setTimeout(onDone,400);}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",zIndex:600,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:0,cursor:"pointer"}}>
      <div className="streak-flame-enter" style={{marginBottom:8}}>
        <div className="flame-big"><FlameSVG size={120} color={fc} innerColor={innerC}/></div>
      </div>
      <div key={numKey} className="streak-num-pop" style={{fontSize:72,fontWeight:900,color:"#fff",lineHeight:1,fontFamily:"'DM Sans',sans-serif",letterSpacing:"-3px",textShadow:`0 0 40px ${fc}80`}}>
        {displayNum}
      </div>
      <div style={{marginTop:10,fontSize:18,fontWeight:600,color:"rgba(255,255,255,0.85)",letterSpacing:"0.5px"}}>
        {newStreak===1?"Premier jour ! 🎉":`jour${newStreak>1?"s":""} de suite 🔥`}
      </div>
      <div style={{marginTop:24,fontSize:12,color:"rgba(255,255,255,0.4)"}}>Tape pour continuer</div>
    </div>
  );
}

/* ─── RING ─── */
function Ring({pct=0,color,size=48,stroke=4,hideText=false,T}){
  const EMERALD=T?T.emerald:"#10b981";
  const FLAME=T?T.flame:"#e87030";
  const exceeds=pct>100;
  const activeColor=exceeds?FLAME:pct>=100?EMERALD:(pct>0?color||T?.accent||"rgba(100,100,100,0.7)":"transparent");
  const visualPct=Math.min(pct,100);
  const r=(size-stroke*2)/2,c=2*Math.PI*r;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T?.muted||"rgba(0,0,0,0.1)"} strokeWidth={stroke}/>
        {pct>0&&<circle cx={size/2} cy={size/2} r={r} fill="none" stroke={activeColor} strokeWidth={stroke} strokeDasharray={`${(visualPct/100)*c} ${c}`} strokeLinecap="round" style={{transition:"stroke-dasharray .4s ease"}}/>}
      </svg>
      {!hideText&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {pct>0&&pct<100&&<span style={{fontSize:size*0.22,fontWeight:700,color:T?.sub||"rgba(0,0,0,0.5)",fontFamily:"monospace"}}>{Math.round(pct)}</span>}
      </div>}
    </div>
  );
}

/* ─── MODAL ─── */
function Modal({visible,onClose,children,T}){
  const[render,setRender]=useState(visible);
  const[anim,setAnim]=useState(visible?"in":"out");
  useEffect(()=>{if(visible){setRender(true);setTimeout(()=>setAnim("in"),10);}else{setAnim("out");setTimeout(()=>setRender(false),340);}},[visible]);
  if(!render)return null;
  const isDark=T?.dark;
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",backdropFilter:"blur(8px)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center",opacity:anim==="in"?1:0,transition:"opacity .3s"}}>
      <div style={{borderRadius:"20px 20px 0 0",padding:"22px 20px 48px",width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",transform:anim==="in"?"translateY(0)":"translateY(100%)",transition:"transform .34s cubic-bezier(.34,1.15,.64,1)",color:T?.text||"#111",fontFamily:"'DM Sans',sans-serif",background:isDark?"#1a1a1e":T?.bg||"#fff",border:`1px solid ${T?.border||"rgba(0,0,0,0.08)"}`,borderBottom:"none",boxShadow:"0 -4px 40px rgba(0,0,0,0.08)"}}>
        {children}
      </div>
    </div>
  );
}

/* ─── TOAST ─── */
function Toast({msg,color}){
  return <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:color,color:"#fff",padding:"9px 20px",borderRadius:30,fontWeight:600,fontSize:13,zIndex:9999,whiteSpace:"nowrap",boxShadow:"0 2px 16px rgba(0,0,0,0.15)",animation:"toastPop .35s cubic-bezier(.34,1.56,.64,1)"}}>{msg}</div>;
}

/* ─── MODE ZEN ─── */
function ZenMode({habits,localProg,onPct,onCommit,T}){
  const n=habits.length;
  const ringSize=n<=2?110:n<=4?88:n<=6?70:n<=9?58:n<=12?48:40;
  const cols=n<=2?2:n<=4?2:3;
  return(
    <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:12,padding:"12px 0",justifyItems:"center"}}>
      {habits.map(h=>{
        const pct=localProg[h.id]||0;
        const handleTap=()=>{const next=pct>=100?0:100;onPct(h.id,next);onCommit(h.id,next);};
        return(
          <div key={h.id} onClick={handleTap} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}>
            <div style={{position:"relative",width:ringSize,height:ringSize}}>
              <Ring pct={pct} size={ringSize} stroke={ringSize>70?5:4} hideText T={T}/>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{fontSize:ringSize*0.35}}>{pct>=100?"✓":h.emoji}</span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── SWIPE CARD ─── */
function SwipeCard({hab,pct,onPct,onCommit,onEdit,T,logs}){
  const EMERALD=T.emerald;
  const FLAME=T.flame||"#e87030";
  const ref=useRef();
  const dragging=useRef(false);
  const startX=useRef(0);
  const startY=useRef(0);
  const pendingPct=useRef(pct);
  const lastCardTap=useRef(0);
  const inputRef=useRef();
  const [displayPct,setDisplayPct]=useState(pct);
  const [showInput,setShowInput]=useState(false);
  const [inputVal,setInputVal]=useState('');

  useEffect(()=>{
    if(!dragging.current&&!showInput) setDisplayPct(pct);
  },[pct]);

  const applyX=clientX=>{
    const rect=ref.current?.getBoundingClientRect();
    if(!rect)return;
    const raw=Math.max(0,Math.min(100,((clientX-rect.left)/rect.width)*100));
    const snapped=Math.round(snapPct(raw,hab)*10)/10;
    pendingPct.current=snapped;
    setDisplayPct(snapped);
  };

  const confirmInput=()=>{
    const val=parseFloat(inputVal);
    if(isNaN(val)||val<0){setShowInput(false);return;}
    let newPct;
    if(hab.goalQty){
      newPct=Math.round((val/hab.goalQty)*1000)/10;
    } else {
      newPct=Math.min(100,val);
    }
    setDisplayPct(newPct);
    pendingPct.current=newPct;
    onPct(newPct);
    onCommit(newPct);
    setShowInput(false);
  };

  const onPD=e=>{
    if(e.target.closest("[data-ctrl]"))return;
    startX.current=e.clientX;
    startY.current=e.clientY;
    dragging.current=false;
    pendingPct.current=displayPct;
  };
  const onPM=e=>{
    const dx=Math.abs(e.clientX-startX.current),dy=Math.abs(e.clientY-startY.current);
    if(!dragging.current){
      if(dy>10&&dy>dx)return;
      if(dx>10){dragging.current=true;ref.current?.setPointerCapture(e.pointerId);}
    }
    if(dragging.current)applyX(e.clientX);
  };
  const onPU=e=>{
    const isCtrl=e.target.closest("[data-ctrl]");
    if(dragging.current){
      applyX(e.clientX);dragging.current=false;
      onPct(pendingPct.current);onCommit(pendingPct.current);return;
    }
    dragging.current=false;
    if(!isCtrl){
      const now=Date.now();
      if(now-lastCardTap.current<350){
        lastCardTap.current=0;
        const currentVal=hab.goalQty?Math.round((displayPct/100)*hab.goalQty*10)/10:Math.round(displayPct);
        setInputVal(currentVal>0?currentVal.toString():'');
        setShowInput(true);
        setTimeout(()=>inputRef.current?.focus(),60);
        return;
      }
      lastCardTap.current=now;
    }
    onPct(pendingPct.current);onCommit(pendingPct.current);
  };
  const onEmojiClick=e=>{
    e.stopPropagation();
    const next=pct>=100?0:100;
    setDisplayPct(next);onPct(next);onCommit(next);
  };

  const prog=fmtProgress(hab,displayPct);
  const done=displayPct>=100;
  const exceeds=displayPct>100;
  const s=streak(hab,logs||{});
  const cardBg=exceeds?`${FLAME}08`:done?`${EMERALD}08`:T.card;
  const cardBorder=exceeds?`${FLAME}55`:done?`${EMERALD}44`:T.border;
  const barBg=exceeds?`${FLAME}0a`:`${EMERALD}09`;
  const nameColor=exceeds?FLAME:done?EMERALD:T.text;
  const subColor=exceeds?FLAME:displayPct>0?EMERALD:T.sub;

  return(
    <div ref={ref} onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU}
      style={{position:"relative",borderRadius:14,overflow:"hidden",background:cardBg,backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",border:`1px solid ${cardBorder}`,cursor:"ew-resize",userSelect:"none",touchAction:"pan-y",transition:"box-shadow .3s,border .3s,background .3s",boxShadow:done?"0 1px 12px rgba(0,0,0,0.04)":"0 1px 6px rgba(0,0,0,0.03)"}}>
      <div style={{position:"absolute",inset:0,width:`${Math.min(displayPct,100)}%`,background:barBg,pointerEvents:"none",transition:"background .3s"}}/>
      <div style={{position:"relative",padding:"13px 14px",display:"flex",alignItems:"center",gap:12}}>
        <div data-ctrl="1" onPointerDown={e=>e.stopPropagation()} onClick={onEmojiClick}
          style={{position:"relative",width:40,height:40,flexShrink:0,cursor:"pointer"}}>
          <Ring pct={displayPct} size={40} stroke={3} hideText T={T}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:15}}>{done?"✓":hab.emoji}</span>
          </div>
        </div>
        <div style={{flex:1,minWidth:0,pointerEvents:"none"}}>
          <div style={{fontWeight:600,fontSize:14,color:nameColor,transition:"color .3s",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{hab.name}</div>
          <div style={{fontSize:11,color:T.sub,marginTop:2,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            {s>0&&<span style={{color:exceeds?FLAME:done?EMERALD:T.sub,fontWeight:500}}>🔥 {s}j</span>}
            {prog
              ?<span style={{color:subColor}}>{prog}{exceeds?" ↑":""}</span>
              :done
                ?<span style={{color:EMERALD}}>Terminé</span>
                :displayPct>0
                  ?<span style={{color:T.sub}}>{Math.round(displayPct)}%</span>
                  :<span style={{color:T.muted}}>← glisse</span>
            }
          </div>
        </div>
        <div data-ctrl="1" style={{pointerEvents:"all"}} onPointerDown={e=>e.stopPropagation()}>
          <button onClick={onEdit} style={{background:"none",border:"none",cursor:"pointer",color:T.muted,fontSize:14,padding:"4px 6px"}}>✎</button>
        </div>
      </div>
      {showInput&&(
        <div data-ctrl="1" className="input-slide-in" onPointerDown={e=>e.stopPropagation()}
          style={{position:"absolute",inset:0,background:T.dark?"rgba(17,17,19,0.97)":"rgba(255,255,255,0.97)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",display:"flex",alignItems:"center",gap:8,padding:"0 12px",zIndex:20,borderRadius:14}}>
          {hab.goalQty&&<span style={{fontSize:11,color:T.sub,whiteSpace:"nowrap",flexShrink:0}}>/ {hab.goalQty}{hab.goalUnit}</span>}
          <input ref={inputRef} type="number" min="0" step={UNIT_INTEGER.includes(hab.goalUnit)?1:0.1} value={inputVal} onChange={e=>setInputVal(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")confirmInput();if(e.key==="Escape")setShowInput(false);}}
            placeholder={hab.goalUnit||"valeur"}
            style={{flex:1,padding:"8px 10px",borderRadius:9,border:`1.5px solid ${T.accent}`,background:T.card,color:T.text,fontSize:16,fontWeight:700,outline:"none",fontFamily:"'DM Sans',sans-serif",minWidth:0}}/>
          {hab.goalUnit&&<span style={{fontSize:13,color:T.sub,fontWeight:600,flexShrink:0}}>{hab.goalUnit}</span>}
          <button onClick={confirmInput} style={{padding:"8px 14px",borderRadius:9,border:"none",background:EMERALD,color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14,flexShrink:0}}>✓</button>
          <button onClick={()=>setShowInput(false)} style={{padding:"8px 10px",borderRadius:9,border:`1px solid ${T.border}`,background:"transparent",color:T.sub,cursor:"pointer",fontSize:13,flexShrink:0}}>✕</button>
        </div>
      )}
    </div>
  );
}

/* ─── HABIT FORM ─── */

  const[name,setName]=useState(hab?.name||"");
  const[emoji,setEmoji]=useState(hab?.emoji||"🏃");
  const[freq,setFreq]=useState(hab?.frequency||"daily");
  const[days,setDays]=useState(hab?.days||[0,1,2,3,4,5,6]);
  const[xpw,setXpw]=useState(hab?.timesPerWeek||3);
  const[meas,setMeas]=useState(!!(hab?.goalQty));
  const[qty,setQty]=useState(hab?.goalQty||1);
  const[unit,setUnit]=useState(hab?.goalUnit||"fois");

  const EMERALD=T.emerald;

    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={{margin:0,fontSize:17,fontWeight:700,color:T.text}}>{hab?"Modifier":"Nouvelle habitude"}</h2>
        <button onClick={onClose} style={{background:T.accentLight,border:"none",borderRadius:20,width:30,height:30,cursor:"pointer",color:T.sub,fontSize:14}}>✕</button>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Icône</label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:7}}>
          <div style={{width:44,height:44,borderRadius:12,background:T.accentLight,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{emoji}</div>

        </div>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Nom</label>
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} placeholder="Ex : Boire de l'eau" style={{...inp,marginTop:7}}/>
      </div>
      <div style={{marginBottom:14,background:T.accentLight,borderRadius:12,padding:12,border:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:meas?12:0}}>
          <div>
            <div style={{fontWeight:600,fontSize:13,color:T.text}}>Objectif mesurable</div>
            <div style={{fontSize:11,color:T.sub,marginTop:1}}>Quantité + unité</div>
          </div>
          <button onClick={()=>setMeas(p=>!p)} style={{width:44,height:24,borderRadius:12,border:"none",cursor:"pointer",background:meas?EMERALD:T.border,position:"relative",transition:"background .25s",flexShrink:0}}>
            <div style={{position:"absolute",top:3,width:18,height:18,borderRadius:"50%",background:"#fff",left:meas?22:3,transition:"left .25s"}}/>
          </button>
        </div>
        {meas&&(
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <div style={{flex:"0 0 80px"}}>
              <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Qté</label>
              <input type="number" min="0.1" step="0.1" value={qty} onChange={e=>setQty(e.target.value)} style={{...inp,marginTop:5,textAlign:"center",fontWeight:700}}/>
            </div>
            <div style={{flex:1}}>
              <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Unité</label>
              <select value={unit} onChange={e=>setUnit(e.target.value)} style={{...inp,marginTop:5}}>
                {UNITS.map(u=><option key={u} value={u}>{u||"Sans unité"}</option>)}
              </select>
            </div>
          </div>
        )}
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Fréquence</label>
        <div style={{display:"flex",gap:6,marginTop:7}}>
          {[{v:"daily",l:"Chaque jour"},{v:"weekly",l:"Jours précis"},{v:"xperweek",l:"X fois/sem"}].map(({v,l})=>(
            <button key={v} onClick={()=>setFreq(v)} style={{flex:1,padding:"8px 4px",borderRadius:9,border:`1.5px solid ${freq===v?T.accent:T.border}`,background:freq===v?T.accentLight:"transparent",color:freq===v?T.accent:T.sub,cursor:"pointer",fontSize:11,fontFamily:"'DM Sans',sans-serif",fontWeight:freq===v?600:400}}>{l}</button>
          ))}
        </div>

      {freq==="weekly"&&(
        <div style={{marginBottom:14}}>
          <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Jours</label>
          <div style={{display:"flex",gap:4,marginTop:7}}>
            {DAYS_FR.map((d,i)=><button key={i} onClick={()=>setDays(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i].sort())} style={{flex:1,padding:"7px 2px",borderRadius:9,border:`1.5px solid ${days.includes(i)?T.accent:T.border}`,background:days.includes(i)?T.accentLight:"transparent",color:days.includes(i)?T.accent:T.sub,cursor:"pointer",fontSize:10,fontWeight:days.includes(i)?600:400}}>{d}</button>)}
          </div>
        </div>
      )}
      {freq==="xperweek"&&(
        <div style={{marginBottom:14}}>
          <label style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:1}}>Objectif : {xpw}x/semaine</label>
          <input type="range" min={1} max={7} value={xpw} onChange={e=>setXpw(+e.target.value)} style={{width:"100%",marginTop:7,accentColor:T.accent}}/>
        </div>
      )}
      <button onClick={save} style={{width:"100%",padding:"13px",border:"none",borderRadius:12,background:saved?EMERALD:T.accent,color:T.dark?"#111":"#fff",fontWeight:700,cursor:"pointer",fontSize:15,transition:"background .3s"}}>
        {saved?"✓ Enregistré !":hab?"Enregistrer":"Créer l'habitude"}
      </button>
      {hab&&<button onClick={()=>onDelete(hab.id)} style={{width:"100%",padding:"11px",border:"1px solid rgba(248,113,113,0.3)",borderRadius:12,background:"transparent",color:"#f87171",fontWeight:500,cursor:"pointer",fontSize:13,marginTop:8}}>Supprimer</button>}
    </>
  );
}

              <div style={{position:"absolute",inset:0,width:`${Math.min(v,100)}%`,background:`${EMERALD}07`,pointerEvents:"none"}}/>
              <span style={{fontSize:18,position:"relative"}}>{h.emoji}</span>
              <div style={{flex:1,position:"relative"}}>
                <div style={{fontWeight:600,fontSize:13,color:T.text}}>{h.name}</div>
                {prog&&<div style={{fontSize:11,color:v>0?EMERALD:T.sub,marginTop:1}}>{prog}{exc?" ↑":""}</div>}
              </div>
              <div style={{position:"relative"}}>{v===0?<span style={{color:"#f87171",fontSize:12,fontWeight:500}}>Non fait</span>:v>=100?<span style={{color:EMERALD,fontSize:12,fontWeight:600}}>✓ Fait</span>:<span style={{color:T.sub,fontSize:12,fontWeight:600}}>{v}%</span>}</div>
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ─── YEAR CALENDAR ─── */
function YearCalendar({year,habits,logs,moods,onDay,T}){
  const EMERALD=T.emerald;
  const td=today();
  const months=Array.from({length:12},(_,m)=>{
    const days=[],first=new Date(year,m,1),last=new Date(year,m+1,0).getDate();
    for(let i=0;i<(first.getDay()+6)%7;i++)days.push(null);
    for(let d=1;d<=last;d++)days.push(`${year}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
    return{m,days};
  });
  const cellBg=d=>{
    if(!d||d>td)return"transparent";
    const mood=moods[d];if(mood)return MOODS[mood.mood].color+"99";
    const sc=dayScore(habits,logs,d);if(sc===null)return T.muted;
    if(sc===0)return T.muted;if(sc<50)return"rgba(251,146,60,0.3)";if(sc<100)return"rgba(250,204,21,0.3)";return`${EMERALD}55`;
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:18}}>
      {months.map(({m,days})=>(
        <div key={m}>
          <div style={{fontSize:11,fontWeight:600,color:T.sub,marginBottom:5,textTransform:"uppercase",letterSpacing:1}}>{MONTHS_FULL[m]}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2.5}}>
            {DAYS_FR.map(d=><div key={d} style={{fontSize:8,color:T.muted,textAlign:"center",paddingBottom:2}}>{d[0]}</div>)}
            {days.map((d,i)=>(
              <button key={i} onClick={()=>d&&d<=td&&onDay(d)} style={{aspectRatio:"1",borderRadius:3,background:cellBg(d),border:`1.5px solid ${d===td?T.accent:"transparent"}`,cursor:d&&d<=td?"pointer":"default"}}/>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── WEEK VIEW ─── */
function WeekView({habits,logs,moods,onEdit,onToggle,T}){
  const EMERALD=T.emerald;
  const td=today();
  const weekDays=(()=>{const days=[],now=new Date(),d=(now.getDay()+6)%7;for(let i=0;i<7;i++){const x=new Date(now);x.setDate(now.getDate()-d+i);days.push(x.toISOString().split("T")[0]);}return days;})();
  return(
    <>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:14,gap:2}}>
        {weekDays.map((d,i)=>{
          const sc=dayScore(habits,logs,d)??0,md=moods[d]?MOODS[moods[d].mood]:null,isT=d===td;
          return(
            <div key={d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:9,color:isT?T.accent:T.sub,fontWeight:isT?700:400}}>{DAYS_FR[i]}</span>
              <Ring pct={sc} size={32} stroke={2.5} T={T}/>
              {md&&<span style={{fontSize:10}}>{md.emoji}</span>}
              <span style={{fontSize:9,color:isT?T.accent:T.sub}}>{new Date(d+"T12:00:00").getDate()}</span>
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {habits.map(h=>(
          <div key={h.id} style={{background:T.card,backdropFilter:"blur(12px)",border:`1px solid ${T.border}`,borderRadius:13,padding:12}}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
              <span style={{fontSize:16}}>{h.emoji}</span>
              <span style={{fontWeight:600,fontSize:13,flex:1,color:T.text}}>{h.name}</span>
              {h.goalQty&&<span style={{fontSize:10,color:EMERALD}}>{h.goalQty}{h.goalUnit}</span>}
              <button onClick={()=>onEdit(h)} style={{background:"none",border:"none",cursor:"pointer",color:T.muted,fontSize:12,padding:"2px 4px"}}>✎</button>
            </div>
            <div style={{display:"flex",gap:2}}>
              {weekDays.map((d,i)=>{
                const sch=scheduled(h,d),val=logs[d]?.[h.id]||0,isFut=d>td;
                return<button key={d} onClick={()=>sch&&!isFut&&onToggle(h.id,d,val>=100?0:100)} style={{flex:1,height:28,borderRadius:6,cursor:sch&&!isFut?"pointer":"default",background:val>=100?`${EMERALD}44`:val>0?`${EMERALD}18`:"transparent",border:`1px solid ${d===td&&sch?T.accent:val>0?EMERALD+"33":T.border}`,color:val>=100?EMERALD:val>0?EMERALD:T.sub,fontSize:9,fontWeight:val>=100?700:400,transition:"all .2s"}}>{val>=100?"✓":val>0?`${val}%`:sch?DAYS_FR[i][0]:"·"}</button>;
              })}
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

/* ─── SORTED HABIT LIST (simplifié, sans FLIP) ─── */
function SortedHabitList({habits,localProg,logs,onPct,onCommit,onEdit,T}){
  /* Ordre : newest first (ID desc) pour non-complétés, complétés à la fin */
  const sorted=useMemo(()=>{
    const notDone=[...habits.filter(h=>(localProg[h.id]||0)<100)].sort((a,b)=>Number(b.id)-Number(a.id));
    const done=[...habits.filter(h=>(localProg[h.id]||0)>=100)].sort((a,b)=>Number(b.id)-Number(a.id));
    return[...notDone,...done];
  },[habits,localProg]);

  return(
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {sorted.map(h=>(
        <div key={h.id} className={h._new?"habit-new":""}>
          <SwipeCard hab={h} pct={localProg[h.id]||0} logs={logs}
            onPct={p=>onPct(h.id,p)}
            onCommit={p=>onCommit(h.id,p)}
            onEdit={()=>onEdit(h)} T={T}/>
        </div>
      ))}
    </div>
  );
}

/* ─── ACHIEVEMENTS VIEW ─── */
function AchievementsView({masterStreak,bestStreak,perfectDays,habitCount,overCount,T}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16,marginBottom:20}}>
      {ACHIEVEMENTS.map(cat=>(

          <div style={{fontSize:10,fontWeight:600,color:T.sub,textTransform:"uppercase",letterSpacing:1,marginBottom:8,display:"flex",alignItems:"center",gap:5}}>
            <span>{cat.icon}</span>{cat.title}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {cat.items.map(item=>{
              const unlocked=item.check(masterStreak,perfectDays,habitCount,overCount);
              return(
                <div key={item.id} style={{background:T.card,border:`1px solid ${unlocked?T.emerald+"44":T.border}`,borderRadius:10,padding:"10px 13px",display:"flex",alignItems:"center",gap:10,opacity:unlocked?1:0.5,transition:"all .2s"}}>
                  <span style={{fontSize:18}}>{unlocked?"✅":"🔒"}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13,color:unlocked?T.text:T.sub}}>{item.label}</div>
                    <div style={{fontSize:11,color:T.sub,marginTop:1}}>{item.desc}</div>

                </div>

/* ══════ MAIN ══════ */
function App(){
  const[habits,setHabits]=useState([]);
  const[logs,setLogs]=useState({});
  const[moods,setMoods]=useState({});
  const[masterStreak,setMasterStreak]=useState(0);
  const[bestStreak,setBestStreak]=useState(0);
  const[perfectDays,setPerfectDays]=useState(0);
  const[overCount,setOverCount]=useState(0);
  const[loaded,setLoaded]=useState(false);
  const[tab,setTab]=useState("today");
  const[calYear,setCalYear]=useState(new Date().getFullYear());
  const[showForm,setShowForm]=useState(false);
  const[editHab,setEditHab]=useState(null);
  const[showMood,setShowMood]=useState(false);
  const[moodCeleb,setMoodCeleb]=useState(false);
  const[showDay,setShowDay]=useState(null);
  const[showSettings,setShowSettings]=useState(false);
  const[toast,setToast]=useState(null);
  const[streakCeleb,setStreakCeleb]=useState(null);
  const[localProg,setLocalProg]=useState({});
  const[zenMode,setZenMode]=useState(false);
  const[themeKey,setThemeKey]=useState(DEFAULT_THEME);
  const[settingsTab,setSettingsTab]=useState("theme");
  const syncRef=useRef({});
  const prevAllDone=useRef(false);

  const T=THEMES[themeKey]||THEMES[DEFAULT_THEME];
  const EMERALD=T.emerald;

  useEffect(()=>{
    const h=store.get(K.habits),l=store.get(K.logs),m=store.get(K.moods);
    const ms=store.get(K.masterStreak)||0,bs=store.get(K.bestStreak)||0,pd=store.get(K.perfectDays)||0;
    const oc=store.get(K.overCount)||0;
    const zen=store.get(K.zenMode)||false,savedTheme=store.get(K.theme)||DEFAULT_THEME;
    if(h)setHabits(h);
    if(l){setLogs(l);setLocalProg(l[today()]||{});}
    if(m)setMoods(m);
    setMasterStreak(ms);setBestStreak(bs);setPerfectDays(pd);setOverCount(oc);
    setZenMode(zen);setThemeKey(savedTheme);
    const lastCheck=store.get(K.lastCheck)||"";
    const td=today();
    if(lastCheck!==td){
      store.set(K.lastCheck,td);
      const habs=h||[],logs2=l||{},yesterday=shift(td,-1);
      const yHabs=habs.filter(x=>scheduled(x,yesterday));
      if(yHabs.length>0){
        const allDoneYest=yHabs.every(x=>(logs2[yesterday]?.[x.id]||0)>=100);
        if(!allDoneYest&&ms>0){
          setMasterStreak(0);store.set(K.masterStreak,0);
          setTimeout(()=>setToast({msg:"Série perdue… à demain 💪",color:"#f87171"}),400);
        }
      }
    }
    setLoaded(true);
  },[]);

  useEffect(()=>{
    document.getElementById("theme-color-meta")?.setAttribute("content",T.bg);
    document.body.style.background=T.bg;
  },[T]);

  const pop=(msg,color)=>{setToast({msg,color});setTimeout(()=>setToast(null),2800);};
  const saveHabits=useCallback(h=>{setHabits(h);store.set(K.habits,h);},[]);
  const saveMoods=useCallback(m=>{setMoods(m);store.set(K.moods,m);},[]);
  const handleProg=useCallback((habId,pct)=>{setLocalProg(prev=>({...prev,[habId]:pct}));},[]);

  const handleCommit=useCallback((habId,pct)=>{
    /* Compteur de dépassements */
    if(pct>100){
      setOverCount(prev=>{const n=prev+1;store.set(K.overCount,n);return n;});
    }
    setLocalProg(prev=>{
      const next={...prev,[habId]:pct};
      clearTimeout(syncRef.current[habId]);
      syncRef.current[habId]=setTimeout(()=>{
        setLogs(prevL=>{const nl={...prevL,[today()]:{...prevL[today()],...next}};store.set(K.logs,nl);return nl;});
      },100);
      return next;
    });
  },[]);

  const switchTheme=useCallback((key)=>{setThemeKey(key);store.set(K.theme,key);},[]);

  useEffect(()=>{
    const td=today(),th=habits.filter(h=>scheduled(h,td));
    if(!th.length)return;
    const allDone=th.every(h=>(localProg[h.id]||0)>=100);
    if(allDone&&!prevAllDone.current){
      prevAllDone.current=true;
      const streakDate=store.get(K.streakDate)||"";
      if(streakDate!==td){
        store.set(K.streakDate,td);
        setMasterStreak(prev=>{
          const newMs=prev+1;
          store.set(K.masterStreak,newMs);
          setBestStreak(bs=>{const nb=Math.max(bs,newMs);store.set(K.bestStreak,nb);return nb;});
          const newPd=perfectDays+1;
          setPerfectDays(newPd);store.set(K.perfectDays,newPd);
          setStreakCeleb({newStreak:newMs});
          return newMs;
        });
      } else {
        setMoodCeleb(true);setShowMood(true);
      }
    }
    if(!allDone)prevAllDone.current=false;
  },[localProg,habits,perfectDays]);

  const handleSaveHab=hab=>{
    let upd;
    if(editHab){upd=habits.map(h=>h.id===editHab.id?{...h,...hab}:h);pop("✏️ Modifiée !",T.sub);}
    else{const n={id:Date.now().toString(),...hab,createdAt:today()};upd=[...habits,n];pop("🌱 Créée !",EMERALD);}
    saveHabits(upd);setShowForm(false);setEditHab(null);setTab("today");
  };
  const handleDelHab=id=>{saveHabits(habits.filter(h=>h.id!==id));setShowForm(false);setEditHab(null);pop("Supprimée","#f87171");};
  const handleMood=(mood,note)=>{
    const next={...moods,[today()]:{mood,note}};
    saveMoods(next);setShowMood(false);setMoodCeleb(false);
    pop(MOODS[mood].emoji+" "+MOODS[mood].label,MOODS[mood].color);
  };
  const handleBulkToggle=useCallback((habId,date,val)=>{
    setLogs(prev=>{const nl={...prev,[date]:{...prev[date],[habId]:val}};store.set(K.logs,nl);return nl;});
  },[]);

  const td=today();
  const todayHabs=habits.filter(h=>scheduled(h,td));
  const allDone=todayHabs.length>0&&todayHabs.every(h=>(localProg[h.id]||0)>=100);
  const todayMood=moods[td];
  const pctToday=todayHabs.length?Math.round(todayHabs.reduce((a,h)=>a+Math.min(localProg[h.id]||0,100),0)/todayHabs.length):0;
  const habitCount=habits.length;

  if(!loaded)return<div style={{background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:T.muted,fontFamily:"monospace",fontSize:13}}>Chargement…</div></div>;

  return(
    <div style={{background:T.bg,minHeight:"100vh",color:T.text,paddingBottom:80,fontFamily:"'DM Sans',sans-serif"}}>
      <ThemeDecor themeKey={themeKey}/>

      {streakCeleb&&(
        <StreakCelebration newStreak={streakCeleb.newStreak} T={T} onDone={()=>{setStreakCeleb(null);setMoodCeleb(true);setShowMood(true);}}/>
      )}
      {toast&&<Toast msg={toast.msg} color={toast.color}/>}

      {/* HEADER */}
      <div style={{backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",background:T.headerBg,borderBottom:`1px solid ${T.border}`,padding:"14px 20px 10px",position:"sticky",top:0,zIndex:10}}>
        <div style={{maxWidth:500,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"nowrap"}}>
                <h1 style={{margin:0,fontSize:16,fontWeight:700,color:T.text,letterSpacing:"-0.3px",whiteSpace:"nowrap"}}>
                  {tab==="today"?"Aujourd'hui":tab==="week"?"Cette semaine":"Calendrier"}
                </h1>
                {tab==="today"&&zenMode&&<span style={{fontSize:10,color:T.accent,background:T.accentLight,borderRadius:20,padding:"2px 7px",flexShrink:0}}>Zen</span>}
                {tab==="today"&&<FlameStreak masterStreak={masterStreak} T={T}/>}
              </div>
              {tab==="today"&&<p style={{margin:"1px 0 0",fontSize:11,color:T.sub,textTransform:"capitalize"}}>{new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              {tab==="today"&&todayHabs.length>0&&(
                <div style={{position:"relative",width:40,height:40}}>
                  <Ring pct={pctToday} size={40} stroke={3.5} T={T}/>
                  <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontSize:9,fontWeight:700,color:pctToday>=100?EMERALD:T.sub,fontFamily:"monospace"}}>{pctToday}%</span>
                  </div>
                </div>
              )}
              <button onClick={()=>setShowSettings(true)} style={{background:T.accentLight,backdropFilter:"blur(8px)",border:`1px solid ${T.border}`,borderRadius:10,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:15,color:T.sub}}>⚙️</button>
            </div>
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div style={{maxWidth:500,margin:"0 auto",padding:"14px 18px",position:"relative",zIndex:1}} className="page" key={tab+(zenMode?"z":"n")}>
        {tab==="today"&&(
          <>
            {habits.length===0?(
              <div style={{textAlign:"center",padding:"60px 0",color:T.sub}}>
                <div style={{fontSize:44}}>✨</div>
                <p style={{marginTop:10,fontSize:14}}>Crée ta première habitude !</p>
              </div>
            ):todayHabs.length===0?(
              <div style={{textAlign:"center",padding:"40px 0",color:T.sub}}>
                <div style={{fontSize:32}}>🎉</div>
                <p style={{fontSize:14}}>Rien de prévu aujourd'hui !</p>
              </div>
            ):zenMode?(
              <ZenMode habits={todayHabs} localProg={localProg} onPct={handleProg} onCommit={(id,p)=>{handleProg(id,p);handleCommit(id,p);}} T={T}/>
            ):(
              <SortedHabitList habits={todayHabs} localProg={localProg} logs={logs} onPct={handleProg} onCommit={handleCommit} onEdit={h=>{setEditHab(h);setShowForm(true);}} T={T}/>
            )}
            {!zenMode&&todayHabs.length>0&&!allDone&&!todayMood&&(
              <button onClick={()=>{setMoodCeleb(false);setShowMood(true);}} style={{marginTop:10,width:"100%",padding:"9px",background:"transparent",border:`1px solid ${T.border}`,borderRadius:11,color:T.sub,fontSize:12,cursor:"pointer"}}>
                🌙 Terminer ma journée
              </button>
            )}
            {!zenMode&&(
              <button onClick={()=>{setEditHab(null);setShowForm(true);}} style={{marginTop:8,width:"100%",padding:"12px",background:T.dark?T.accentLight:"transparent",border:`1.5px solid ${T.border}`,borderRadius:12,color:T.accent,fontSize:14,fontWeight:600,cursor:"pointer",transition:"background .2s"}}>
                + Nouvelle habitude
              </button>
            )}
          </>
        )}
        {tab==="week"&&<WeekView habits={habits} logs={logs} moods={moods} onEdit={h=>{setEditHab(h);setShowForm(true);}} onToggle={handleBulkToggle} T={T}/>}
        {tab==="calendar"&&(
          <>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <button onClick={()=>setCalYear(y=>y-1)} style={{background:T.accentLight,border:`1px solid ${T.border}`,borderRadius:9,padding:"5px 14px",color:T.text,cursor:"pointer",fontSize:14}}>‹</button>
              <span style={{fontWeight:700,fontSize:16,color:T.text}}>{calYear}</span>
              <button onClick={()=>setCalYear(y=>y+1)} style={{background:T.accentLight,border:`1px solid ${T.border}`,borderRadius:9,padding:"5px 14px",color:T.text,cursor:"pointer",fontSize:14}}>›</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              {MOODS.map((m,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:T.sub}}><div style={{width:7,height:7,borderRadius:2,background:m.color+"99"}}/>{m.emoji}</div>)}
              <div style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:T.sub}}><div style={{width:7,height:7,borderRadius:2,background:`${EMERALD}55`}}/><span>100%</span></div>
            </div>
            <YearCalendar year={calYear} habits={habits} logs={logs} moods={moods} onDay={setShowDay} T={T}/>
          </>
        )}

      {/* BOTTOM TABS */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",background:T.headerBg,borderTop:`1px solid ${T.border}`,padding:"8px 0 20px",zIndex:50}}>
        <div style={{maxWidth:500,margin:"0 auto",display:"flex",justifyContent:"center"}}>
          {[{k:"today",icon:"☀️",l:"Aujourd'hui"},{k:"week",icon:"📅",l:"Semaine"},{k:"calendar",icon:"🗓",l:"Calendrier"}].map(({k,icon,l})=>(
            <button key={k} onClick={()=>setTab(k)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"5px 0"}}>
              <span style={{fontSize:18,opacity:tab===k?1:0.35}}>{icon}</span>
              <span style={{fontSize:10,color:tab===k?T.accent:T.sub,fontWeight:tab===k?600:400}}>{l}</span>
              {tab===k&&<div style={{width:16,height:2,background:T.accent,borderRadius:2}}/>}
            </button>
          ))}
        </div>
      </div>

      {/* MODALS */}
      <Modal visible={showForm} onClose={()=>{setShowForm(false);setEditHab(null);}} T={T}>
        <HabitForm hab={editHab} onSave={handleSaveHab} onDelete={handleDelHab} onClose={()=>{setShowForm(false);setEditHab(null);}} T={T}/>
      </Modal>
      <Modal visible={showMood} onClose={()=>{setShowMood(false);setMoodCeleb(false);}} T={T}>
        <MoodPicker date={td} current={todayMood?.mood} note={todayMood?.note} isCeleb={moodCeleb} onSave={handleMood} onClose={()=>{setShowMood(false);setMoodCeleb(false);}} T={T}/>
      </Modal>
      <Modal visible={!!showDay} onClose={()=>setShowDay(null)} T={T}>
        {showDay&&<DayDetail date={showDay} habits={habits} logs={logs} mood={moods[showDay]} onClose={()=>setShowDay(null)} T={T}/>}
      </Modal>
      <Modal visible={showSettings} onClose={()=>setShowSettings(false)} T={T}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={{margin:0,fontSize:17,fontWeight:700,color:T.text}}>Paramètres</h2>
          <button onClick={()=>setShowSettings(false)} style={{background:T.accentLight,border:"none",borderRadius:20,width:30,height:30,cursor:"pointer",color:T.sub,fontSize:14}}>✕</button>
        </div>

        {/* Onglets settings */}
        <div style={{display:"flex",gap:6,marginBottom:18}}>
          {[{k:"theme",l:"Thème"},{k:"progress",l:"Progression"},{k:"achievements",l:"Succès"}].map(({k,l})=>(
            <button key={k} onClick={()=>setSettingsTab(k)} style={{flex:1,padding:"7px 4px",borderRadius:9,border:`1.5px solid ${settingsTab===k?T.accent:T.border}`,background:settingsTab===k?T.accentLight:"transparent",color:settingsTab===k?T.accent:T.sub,cursor:"pointer",fontSize:11,fontWeight:settingsTab===k?600:400}}>{l}</button>
          ))}
        </div>

        {settingsTab==="theme"&&(
          <>
            <div style={{fontSize:10,fontWeight:600,color:T.sub,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Thème</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:20}}>
              {ALL_THEMES.map(({key,label})=>{
                const th=THEMES[key];
                const isActive=themeKey===key;
                return(
                  <button key={key} onClick={()=>switchTheme(key)} style={{padding:"9px 12px",borderRadius:10,border:`1.5px solid ${isActive?T.accent:T.border}`,background:isActive?T.accentLight:"transparent",color:isActive?T.accent:T.sub,cursor:"pointer",fontSize:12,fontWeight:isActive?600:400,textAlign:"left",display:"flex",alignItems:"center",gap:8,transition:"all .2s"}}>
                    <div style={{width:10,height:10,borderRadius:"50%",background:th.accent,flexShrink:0}}/>
                    {label}
                  </button>
                );
              })}
            </div>
            <div style={{background:T.accentLight,borderRadius:12,padding:13,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontWeight:600,fontSize:13,color:T.text}}>Mode Zen</div>
                <div style={{fontSize:11,color:T.sub,marginTop:1}}>Grille d'emojis épurée</div>
              </div>
              <button onClick={()=>setZenMode(p=>{const n=!p;store.set(K.zenMode,n);return n;})} style={{width:44,height:24,borderRadius:12,border:"none",cursor:"pointer",background:zenMode?EMERALD:T.border,position:"relative",transition:"background .25s",flexShrink:0}}>
                <div style={{position:"absolute",top:3,width:18,height:18,borderRadius:"50%",background:"#fff",left:zenMode?22:3,transition:"left .25s"}}/>
              </button>
            </div>
          </>
        )}

        {settingsTab==="progress"&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            {[
              {icon:"🔥",label:"Série actuelle",value:`${masterStreak} jour${masterStreak>1?"s":""}`},
              {icon:"🏆",label:"Meilleure série",value:`${bestStreak} jour${bestStreak>1?"s":""}`},
              {icon:"⭐",label:"Journées parfaites",value:`${perfectDays} total`},
              {icon:"💪",label:"Dépassements",value:`${overCount} fois`},
            ].map(({icon,label,value})=>(
              <div key={label} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:11,padding:"11px 10px",textAlign:"center",backdropFilter:"blur(8px)"}}>
                <div style={{fontSize:20,marginBottom:4}}>{icon}</div>
                <div style={{fontWeight:700,fontSize:13,color:T.text}}>{value}</div>
                <div style={{fontSize:9,color:T.sub,marginTop:2}}>{label}</div>
              </div>
            ))}
          </div>
        )}

        {settingsTab==="achievements"&&(
          <AchievementsView
            masterStreak={masterStreak}
            bestStreak={bestStreak}
            perfectDays={perfectDays}
            habitCount={habitCount}
            overCount={overCount}
            T={T}
          />
        )}
      </Modal>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
