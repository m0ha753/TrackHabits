<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-title" content="Habitudes"/>
<meta charset="UTF-8"/>
<title>TrackHabits</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{overscroll-behavior:none; -webkit-user-select: none;}
  @keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes popIn{0%{opacity:0;transform:scale(.6) translateY(14px)}65%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .habit-new{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
  .page{animation:fadeUp .28s ease both}
  input,select,textarea{-webkit-appearance:none; outline:none;}
  ::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

const K={habits:"ht5-habits",logs:"ht5-logs",moods:"ht5-moods",theme:"ht5-theme"};
const store={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const THEMES={
  organic:{id:"organic",label:"🌿 Organic",bg:"#f5f0eb",card:"#fffdf9",border:"#e8e0d5",text:"#2c2416",sub:"#8a7a6a",muted:"#b5a898",accent:"#7c9e6e",tab:"#fffdf9",tabBorder:"#e8e0d5",header:"#fffdf9",font:"'Fraunces',serif",ui:"'DM Sans',sans-serif",dark:false},
  nebula:{id:"nebula",label:"🌌 Nebula",bg:"#0d0d14",card:"#14141f",border:"#22223a",text:"#e8e4ff",sub:"#7070aa",muted:"#3a3a5a",accent:"#9b7cff",tab:"#14141f",tabBorder:"#22223a",header:"#14141f",font:"'Space Grotesk',sans-serif",ui:"'Space Grotesk',sans-serif",dark:true},
  neon:{id:"neon",label:"⚡ Neon",bg:"#0a0a0a",card:"#111111",border:"#1f1f1f",text:"#f0f0f0",sub:"#666666",muted:"#333333",accent:"#00ff88",tab:"#111111",tabBorder:"#1f1f1f",header:"#111111",font:"'Syne',sans-serif",ui:"'Syne',sans-serif",dark:true},
};

const HABIT_COLORS=["#f472b6","#a78bfa","#60a5fa","#34d399","#facc15","#fb923c","#f87171","#22d3ee"];
const MOODS=[{emoji:"😔",label:"Difficile",color:"#f87171"},{emoji:"😐",label:"Moyen",color:"#fb923c"},{emoji:"🙂",label:"Bien",color:"#facc15"},{emoji:"😊",label:"Super",color:"#4ade80"},{emoji:"🤩",label:"Incroyable",color:"#f472b6"}];
const UNITS=["L","ml","h","min","km","m","fois","pages","kcal","€",""];
const DAYS_FR=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const MONTHS_FULL=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const BADGES=[
  {id:"first",emoji:"🌱",label:"Première",desc:"Créer ta 1ère habitude",check:(h)=>h.length>=1},
  {id:"w7",emoji:"🔥",label:"Semaine feu",desc:"7j consécutifs",check:(h,l)=>h.some(x=>streak(x,l)>=7)},
  {id:"m30",emoji:"💎",label:"Diamant",desc:"30j consécutifs",check:(h,l)=>h.some(x=>streak(x,l)>=30)},
  {id:"perf",emoji:"⭐",label:"Parfait",desc:"Semaine 100%",check:(h,l)=>checkPerfect(h,l)},
  {id:"mood30",emoji:"🧘",label:"Équilibre",desc:"30 humeurs enregistrées",check:(_,__,m)=>Object.keys(m).length>=30},
  {id:"all5",emoji:"🏆",label:"Champion",desc:"5 habitudes actives",check:(h)=>h.length>=5},
];

const today=()=>new Date().toISOString().split("T")[0];
const dow=d=>(new Date(d+"T12:00:00").getDay()+6)%7;
const shift=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().split("T")[0];};
const lastN=n=>Array.from({length:n},(_,i)=>shift(today(),-(n-1-i)));
const scheduled=(h,d)=>h.frequency==="daily"?true:h.frequency==="weekly"?(h.days||[]).includes(dow(d)):true;
const scoreColor=p=>p>=80?"#4ade80":p>=45?"#facc15":"#f87171";

function streak(hab,logs){
  let s=0;
  for(let i=0;i<365;i++){const d=shift(today(),-i);if(!scheduled(hab,d))continue;if((logs[d]?.[hab.id]||0)>=100)s++;else break;}
  return s;
}
function checkPerfect(habits,logs){
  return lastN(7).every(d=>{const sc=habits.filter(h=>scheduled(h,d));return sc.length>0&&sc.every(h=>(logs[d]?.[h.id]||0)>=100);});
}
const dayScore=(habits,logs,d)=>{const sc=habits.filter(h=>scheduled(h,d));if(!sc.length)return null;return Math.round(sc.reduce((a,h)=>a+(logs[d]?.[h.id]||0),0)/sc.length);};

const fmtProgress=(hab,pct)=>{
  if(!hab.goalQty) return null;
  const cur = (pct/100) * hab.goalQty;
  const displayCur = hab.goalUnit === "fois" ? Math.round(cur) : Math.round(cur * 10) / 10;
  return `${displayCur}${hab.goalUnit} / ${hab.goalQty}${hab.goalUnit}`;
};

function Confetti({onDone}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");c.width=window.innerWidth;c.height=window.innerHeight;
    const pieces=Array.from({length:120},()=>({x:Math.random()*c.width,y:-10-Math.random()*200,vx:(Math.random()-.5)*5,vy:3+Math.random()*5,r:4+Math.random()*6,color:["#f472b6","#a78bfa","#facc15","#4ade80","#60a5fa","#fb923c"][Math.floor(Math.random()*6)],rot:Math.random()*360,vrot:(Math.random()-.5)*8}));
    let frame=0,raf;
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      pieces.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,1-frame/80);ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);ctx.restore();p.x+=p.vx;p.y+=p.vy;p.rot+=p.vrot;p.vy+=0.08;});
      frame++;
      if(frame<100)raf=requestAnimationFrame(draw);else onDone();
    };
    raf=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(raf);
  },[]);
  return React.createElement("canvas",{ref,style:{position:"fixed",inset:0,zIndex:490,pointerEvents:"none"}});
}

function Ring({pct=0,color,size=48,stroke=4,t}){
  const tc=t||THEMES.nebula,r=(size-stroke*2)/2,c=2*Math.PI*r;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={tc.muted} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${(pct/100)*c} ${c}`} strokeLinecap="round" style={{transition:"stroke-dasharray .4s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {pct>0&&<span style={{fontSize:size*0.22,fontWeight:700,color,fontFamily:"monospace"}}>{pct===100?"✓":`${pct}`}</span>}
      </div>
    </div>
  );
}

function Modal({visible,onClose,t,children}){
  const[render,setRender]=useState(visible);
  const[anim,setAnim]=useState(visible?"in":"out");
  useEffect(()=>{if(visible){setRender(true);setTimeout(()=>setAnim("in"),10);}else{setAnim("out");setTimeout(()=>setRender(false),340);}},[visible]);
  if(!render)return null;
  return(
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"#00000099",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center",opacity:anim==="in"?1:0,transition:"opacity .3s"}}>
      <div style={{background:t.card,borderRadius:"24px 24px 0 0",padding:"22px 20px 48px",width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto",borderTop:`1px solid ${t.border}`,transform:anim==="in"?"translateY(0)":"translateY(100%)",transition:"transform .34s cubic-bezier(.34,1.15,.64,1)",color:t.text,fontFamily:t.ui}}>
        {children}
      </div>
    </div>
  );
}

function Toast({msg,color}){
  return <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:color,color:"#fff",padding:"10px 22px",borderRadius:30,fontWeight:700,fontSize:14,zIndex:9999,whiteSpace:"nowrap",boxShadow:"0 4px 20px #0004",animation:"toastPop .35s cubic-bezier(.34,1.56,.64,1)"}}>{msg}</div>;
}

function SwipeCard({hab,pct,onPct,onEdit,t}){
  const ref=useRef();
  const dragging=useRef(false);
  const startX=useRef(0);
  const hasMoved=useRef(false);
  const [showInput, setShowInput] = useState(false);
  const [tempVal, setTempVal] = useState("");

  const apply=clientX=>{
    const rect=ref.current?.getBoundingClientRect();
    if(!rect)return;
    let newPct = Math.round(((clientX-rect.left)/rect.width)*100/5)*5;
    
    if(hab.goalQty && hab.goalUnit === "fois") {
        const curValue = Math.round((newPct/100) * hab.goalQty);
        newPct = (curValue / hab.goalQty) * 100;
    }
    onPct(Math.max(0, Math.min(100, newPct)));
  };

  const onPD=e=>{
    dragging.current=true;
    startX.current=e.clientX;
    hasMoved.current=false;
    ref.current?.setPointerCapture(e.pointerId);
  };

  const onPM=e=>{
    if(!dragging.current) return;
    if(!hasMoved.current && Math.abs(e.clientX-startX.current) > 15) {
        hasMoved.current = true;
    }
    if(hasMoved.current) apply(e.clientX);
  };

  const onPU=e=>{
    dragging.current=false;
    ref.current?.releasePointerCapture(e.pointerId);
  };

  const handleInputBlur = () => {
    if(tempVal !== "") {
        let val = parseFloat(tempVal);
        if(hab.goalQty) {
            let p = (val / hab.goalQty) * 100;
            onPct(Math.max(0, Math.min(100, p)));
        } else {
            onPct(val >= 1 ? 100 : 0);
        }
    }
    setShowInput(false);
    setTempVal("");
  };

  const prog=fmtProgress(hab,pct);
  const s=streak(hab,store.get(K.logs)||{});

  return(
    <div style={{marginBottom:12}}>
        <div ref={ref} onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} style={{position:"relative",borderRadius:18,overflow:"hidden",background:t.card,border:`1.5px solid ${pct===100?hab.color+"66":t.border}`,cursor:"ew-resize",userSelect:"none",touchAction:"pan-y"}}>
        <div style={{position:"absolute",inset:0,width:`${pct}%`,background:`linear-gradient(90deg,${hab.color}25,${hab.color}10)`,transition:hasMoved.current?"none":"width .3s",pointerEvents:"none"}}/>
        <div style={{position:"relative",padding:"14px 16px",display:"flex",alignItems:"center",gap:14,pointerEvents:"none"}}>
            <div onClick={(e)=>{e.stopPropagation(); onPct(pct===100?0:100);}} style={{pointerEvents:"all"}}>
                <Ring pct={pct} color={pct>0?hab.color:t.muted} size={42} stroke={3.5} t={t}/>
            </div>
            
            <div onClick={() => setShowInput(true)} style={{flex:1, minWidth:0, pointerEvents:"all"}}>
            {showInput ? (
                <input autoFocus type="number" value={tempVal} onChange={e=>setTempVal(e.target.value)} onBlur={handleInputBlur} onKeyDown={e=>e.key==='Enter'&&handleInputBlur()} style={{background:'none', border:'none', color:t.text, fontSize:15, fontWeight:700, width:'100%', fontFamily:t.font}} placeholder="..."/>
            ) : (
                <>
                <div style={{fontWeight:700,fontSize:15,color:pct===100?hab.color:t.text,fontFamily:t.font}}>{hab.emoji} {hab.name}</div>
                <div style={{fontSize:12,color:t.sub,marginTop:3,display:"flex",gap:8}}>
                    {s>0&&<span style={{color:hab.color,fontWeight:600}}>🔥 {s}j</span>}
                    {prog ? <span style={{color:pct>0?hab.color:t.sub}}>{prog}</span> : pct===100 ? <span style={{color:hab.color}}>✓ Terminé !</span> : pct>0 ? <span style={{color:hab.color}}>{pct}%</span> : <span>← Glisse pour avancer</span>}
                </div>
                </>
            )}
            </div>
            <button onClick={(e)=>{e.stopPropagation(); onEdit();}} style={{pointerEvents:"all",background:"none",border:"none",color:t.sub,fontSize:16,padding:"4px 6px"}}>✎</button>
        </div>
        </div>
    </div>
  );
}

function HabitForm({hab,onSave,onDelete,onClose,t}){
  const[name,setName]=useState(hab?.name||"");
  const[emoji,setEmoji]=useState(hab?.emoji||"🏃");
  const[color,setColor]=useState(hab?.color||HABIT_COLORS[0]);
  const[freq,setFreq]=useState(hab?.frequency||"daily");
  const[days,setDays]=useState(hab?.days||[0,1,2,3,4,5,6]);
  const[xpw,setXpw]=useState(hab?.timesPerWeek||3);
  const[meas,setMeas]=useState(!!(hab?.goalQty));
  const[qty,setQty]=useState(hab?.goalQty||1);
  const[unit,setUnit]=useState(hab?.goalUnit||"fois");
  const inp={width:"100%",padding:"10px 12px",borderRadius:10,border:`1px solid ${t.border}`,background:t.bg,color:t.text,fontSize:14,fontFamily:t.ui};
  return(
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={{margin:0,fontSize:18,fontWeight:700,fontFamily:t.font}}>{hab?"Modifier":"Nouvelle habitude"}</h2>
        <button onClick={onClose} style={{background:t.border,border:"none",borderRadius:20,width:32,height:32}}>✕</button>
      </div>
      <div style={{marginBottom:16}}>
        <label style={{fontSize:11,color:t.sub,textTransform:"uppercase"}}>Icône</label>
        <div style={{display:"flex",gap:10,marginTop:8}}>
          <div style={{width:48,height:48,borderRadius:14,background:color+"22",border:`2px solid ${color}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{emoji}</div>
          <input value={emoji} onChange={e=>setEmoji(e.target.value)} style={{...inp,flex:1}}/>
        </div>
      </div>
      <div style={{marginBottom:16}}><label style={{fontSize:11,color:t.sub,textTransform:"uppercase"}}>Nom</label><input value={name} onChange={e=>setName(e.target.value)} style={{...inp,marginTop:8}}/></div>
      <div style={{marginBottom:16,background:t.bg,borderRadius:14,padding:14,border:`1px solid ${t.border}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:600,fontSize:14}}>Objectif mesurable</div></div>
          <button onClick={()=>setMeas(!meas)} style={{width:46,height:26,borderRadius:13,background:meas?color:t.border,position:"relative",border:"none"}}><div style={{position:"absolute",top:3,width:20,height:20,borderRadius:"50%",background:"#fff",left:meas?22:3}}/></button>
        </div>
        {meas&&<div style={{display:"flex",gap:8,marginTop:12}}>
          <input type="number" value={qty} onChange={e=>setQty(e.target.value)} style={{...inp,flex:1}}/><select value={unit} onChange={e=>setUnit(e.target.value)} style={{...inp,flex:1}}>{UNITS.map(u=><option key={u} value={u}>{u||"unité"}</option>)}</select>
        </div>}
      </div>
      <button onClick={()=>onSave({name,emoji,color,frequency:freq,days,goalQty:meas?Number(qty):null,goalUnit:meas?unit:""})} style={{width:"100%",padding:14,background:color,color:"#fff",border:"none",borderRadius:14,fontWeight:700}}>Enregistrer</button>
      {hab&&<button onClick={()=>onDelete(hab.id)} style={{width:"100%",marginTop:10,background:"none",border:"none",color:"#f87171"}}>Supprimer</button>}
    </>
  );
}

function YearCalendar({year,habits,logs,moods,onDay,t}){
  const td=today();
  const months=Array.from({length:12},(_,m)=>{
    const days=[],first=new Date(year,m,1),last=new Date(year,m+1,0).getDate();
    for(let i=0;i<(first.getDay()+6)%7;i++)days.push(null);
    for(let d=1;d<=last;d++)days.push(`${year}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
    return{m,days};
  });
  const cellBg=d=>{
    if(!d||d>td)return"transparent";
    const sc=dayScore(habits,logs,d);if(sc===null)return t.border;
    if(sc===0)return t.muted;if(sc<100)return"#facc1566";return"#4ade8066";
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {months.map(({m,days})=>(
        <div key={m}>
          <div style={{fontSize:11,fontWeight:700,color:t.sub,marginBottom:6,textTransform:"uppercase"}}>{MONTHS_FULL[m]}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2.5}}>
            {days.map((d,i)=>(<button key={i} onClick={()=>d&&d<=td&&onDay(d)} style={{aspectRatio:"1",borderRadius:3,background:cellBg(d),border:"none",cursor:d?"pointer":"default"}}/>))}
          </div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const[habits,setHabits]=useState(store.get(K.habits)||[]);
  const[logs,setLogs]=useState(store.get(K.logs)||{});
  const[moods,setMoods]=useState(store.get(K.moods)||{});
  const[themeId,setThemeId]=useState(store.get(K.theme)||"nebula");
  const[tab,setTab]=useState("today");
  const[showForm,setShowForm]=useState(false);
  const[editHab,setEditHab]=useState(null);
  const[confetti,setConfetti]=useState(false);
  const[toast,setToast]=useState(null);
  const[showDay,setShowDay]=useState(null);
  const[calYear,setCalYear]=useState(new Date().getFullYear());
  
  const t=THEMES[themeId];
  const td=today();

  const pop=(msg,color)=>{setToast({msg,color});setTimeout(()=>setToast(null),2000);};

  const handlePct=(id,val)=>{
    const nl={...logs,[td]:{...(logs[td]||{}),[id]:val}};
    setLogs(nl);store.set(K.logs,nl);
    if(val===100 && !Object.values(logs[td]||{}).includes(100)) setConfetti(true);
  };

  const handleSave=h=>{
    const upd=editHab?habits.map(x=>x.id===editHab.id?{...x,...h}:x):[...habits,{id:Date.now().toString(),...h}];
    setHabits(upd);store.set(K.habits,upd);
    setShowForm(false);setEditHab(null);
    pop(editHab?"Modifiée !":"Créée !",h.color);
  };

  const todayHabs=habits.filter(h=>scheduled(h,td));
  const earnedBadges=BADGES.filter(b=>b.check(habits,logs,moods));

  return(
    <div style={{background:t.bg,minHeight:"100vh",color:t.text,paddingBottom:90,fontFamily:t.ui}}>
      {confetti&&<Confetti onDone={()=>setConfetti(false)}/>}
      {toast&&<Toast msg={toast.msg} color={toast.color}/>}

      <div style={{padding:"20px 20px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{margin:0,fontSize:22,fontFamily:t.font}}>{tab==="today"?"Aujourd'hui":tab==="calendar"?"Calendrier":"Succès"}</h1>
        <button onClick={()=>setThemeId(themeId==="nebula"?"organic":"nebula")} style={{background:t.card,border:"none",padding:8,borderRadius:10,fontSize:18}}>{themeId==="nebula"?"🌿":"🌌"}</button>
      </div>

      <div style={{padding:20}}>
        {tab==="today" && (
            <>
            {todayHabs.length === 0 ? <p style={{textAlign:"center",color:t.sub,marginTop:40}}>Rien pour aujourd'hui !</p> :
            todayHabs.map(h=><SwipeCard key={h.id} hab={h} pct={logs[td]?.[h.id]||0} onPct={p=>handlePct(h.id,p)} onEdit={()=>{setEditHab(h);setShowForm(true);}} t={t}/>)}
            <button onClick={()=>{setEditHab(null);setShowForm(true);}} style={{width:"100%",padding:15,marginTop:10,background:t.accent,color:"#fff",border:"none",borderRadius:15,fontWeight:700,fontSize:15}}>+ Ajouter une habitude</button>
            </>
        )}

        {tab==="calendar" && (
            <YearCalendar year={calYear} habits={habits} logs={logs} moods={moods} onDay={setShowDay} t={t}/>
        )}

        {tab==="stats" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {BADGES.map(b=>(
                <div key={b.id} style={{background:t.card,padding:15,borderRadius:15,border:`1px solid ${earnedBadges.find(x=>x.id===b.id)?t.accent:t.border}`,opacity:earnedBadges.find(x=>x.id===b.id)?1:0.3}}>
                    <div style={{fontSize:24}}>{b.emoji}</div>
                    <div style={{fontWeight:700,fontSize:13}}>{b.label}</div>
                </div>
            ))}
          </div>
        )}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:t.tab,borderTop:`1px solid ${t.tabBorder}`,display:"flex",padding:"10px 0 20px"}}>
        {[{k:"today",i:"☀️",l:"Aujourd'hui"},{k:"calendar",i:"🗓",l:"Calendrier"},{k:"stats",i:"🏆",l:"Badges"}].map(x=>(
            <button key={x.k} onClick={()=>setTab(x.k)} style={{flex:1,background:"none",border:"none",color:tab===x.k?t.accent:t.sub,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:20}}>{x.i}</span>
                <span style={{fontSize:10,fontWeight:700}}>{x.l}</span>
            </button>
        ))}
      </div>

      <Modal visible={showForm} onClose={()=>setShowForm(false)} t={t}>
        <HabitForm hab={editHab} onSave={handleSave} onDelete={id=>{setHabits(habits.filter(x=>x.id!==id));setShowForm(false);pop("Supprimée","#f87171");}} onClose={()=>setShowForm(false)} t={t}/>
      </Modal>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
