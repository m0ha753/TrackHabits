<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>TrackHabits</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="Habitudes">

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
    </script>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      .page{animation:fadeUp .28s ease both}
      @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      ::-webkit-scrollbar{display:none}
    </style>

    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <script src="babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

// --- CONFIG & HELPERS ---
const K={habits:"ht5-habits",logs:"ht5-logs",moods:"ht5-moods",theme:"ht5-theme"};
const store={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const THEMES={
  nebula:{id:"nebula",label:"🌌 Nebula",bg:"#0d0d14",card:"#14141f",border:"#22223a",text:"#e8e4ff",sub:"#7070aa",muted:"#3a3a5a",accent:"#9b7cff",dark:true},
  organic:{id:"organic",label:"🌿 Organic",bg:"#f5f0eb",card:"#fffdf9",border:"#e8e0d5",text:"#2c2416",sub:"#8a7a6a",accent:"#7c9e6e",dark:false},
};

const today=()=>new Date().toISOString().split("T")[0];
const scheduled=(h,d)=>h.frequency==="daily"?true:true; // Simplifié pour l'exemple

/* ─── COMPOSANT CARTE (MODIFIÉ) ─── */
function SwipeCard({hab, pct, onPct, onEdit, t}) {
  const ref = useRef();
  const dragging = useRef(false);
  const startX = useRef(0);
  const startPct = useRef(0);
  const hasMovedSignificant = useRef(false);

  const apply = (clientX) => {
    const rect = ref.current?.getBoundingClientRect();
    if (!rect) return;
    // Calcul de la progression basé sur la position horizontale
    const relativeX = clientX - rect.left;
    const newPct = Math.max(0, Math.min(100, Math.round((relativeX / rect.width) * 100 / 5) * 5));
    onPct(newPct);
  };

  const onPointerDown = (e) => {
    dragging.current = true;
    startX.current = e.clientX;
    startPct.current = pct;
    hasMovedSignificant.current = false;
    ref.current?.setPointerCapture(e.pointerId);
  };

  const onPointerMove = (e) => {
    if (!dragging.current) return;

    // PROTECTION : On ne modifie rien si le mouvement est inférieur à 15px
    // Cela évite les changements quand on veut juste scroller verticalement
    if (!hasMovedSignificant.current) {
      if (Math.abs(e.clientX - startX.current) > 15) {
        hasMovedSignificant.current = true;
      } else {
        return;
      }
    }

    apply(e.clientX);
  };

  const onPointerUp = (e) => {
    dragging.current = false;
    ref.current?.releasePointerCapture(e.pointerId);
  };

  return (
    <div 
      ref={ref} 
      onPointerDown={onPointerDown} 
      onPointerMove={onPointerMove} 
      onPointerUp={onPointerUp}
      style={{
        position:"relative",borderRadius:18,overflow:"hidden",background:t.card,
        border:`1.5px solid ${pct===100?hab.color+"66":t.border}`,
        cursor:"ew-resize",userSelect:"none",touchAction:"pan-y", // pan-y permet de garder le scroll vertical fluide
        marginBottom: 10, transition: "border-color 0.3s"
      }}
    >
      <div style={{position:"absolute",inset:0,width:`${pct}%`,background:`linear-gradient(90deg,${hab.color}25,${hab.color}10)`,transition:dragging.current?"none":"width 0.3s"}}/>
      
      <div style={{position:"relative",padding:"14px 16px",display:"flex",alignItems:"center",gap:14,pointerEvents:"none"}}>
        <div style={{width:42,height:42,borderRadius:"50%",border:`3px solid ${pct>0?hab.color:t.muted}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
            {pct === 100 ? "✓" : hab.emoji}
        </div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15,color:t.text}}>{hab.name}</div>
          <div style={{fontSize:12,color:t.sub,marginTop:3}}>
            {pct === 100 ? <span style={{color:hab.color}}>Terminé !</span> : pct > 0 ? `${pct}%` : "← Glisse pour avancer"}
          </div>
        </div>
        <button onClick={(e) => {e.stopPropagation(); onEdit();}} style={{pointerEvents:"all", background:"none", border:"none", color:t.sub, fontSize:16}}>✎</button>
      </div>
    </div>
  );
}

/* ─── APP PRINCIPALE (SIMPLIFIÉE) ─── */
function App() {
  const [habits, setHabits] = useState(store.get(K.habits) || [{id:"1", name:"Sport", emoji:"💪", color:"#9b7cff", frequency:"daily"}]);
  const [logs, setLogs] = useState(store.get(K.logs) || {});
  const t = THEMES.nebula;

  const handlePct = (id, val) => {
    const newLogs = {...logs, [today()]: {...logs[today()], [id]: val}};
    setLogs(newLogs);
    store.set(K.logs, newLogs);
  };

  return (
    <div style={{background:t.bg, minHeight:"100vh", padding:20, color:t.text}}>
      <h1 style={{fontSize:22, marginBottom:20}}>Mes Habitudes</h1>
      {habits.map(h => (
        <SwipeCard 
          key={h.id} 
          hab={h} 
          pct={logs[today()]?.[h.id] || 0} 
          onPct={(v) => handlePct(h.id, v)} 
          onEdit={() => alert('Edition')} 
          t={t} 
        />
      ))}
      <p style={{fontSize:12, color:t.sub, textAlign:"center", marginTop:20}}>
        Le réglage est désormais moins sensible aux frôlements.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
