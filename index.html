<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>TrackHabits</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="Habitudes">

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
    </script>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      @keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:scale(1)}}
      .page{animation:popIn .3s ease-out both}
      ::-webkit-scrollbar{display:none}
      
      .quick-btn {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #ffffff22;
        background: #ffffff11;
        color: white;
        font-size: 13px;
        font-weight: 600;
      }
    </style>

    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <script src="babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef} = React;

/* ─── CONFIGURATION ─── */
const K = {habits: "ht5-habits", logs: "ht5-logs", theme: "ht5-theme"};
const store = {
  get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } },
};

const THEMES = {
  nebula: {id: "nebula", bg: "#0d0d14", card: "#14141f", border: "#22223a", text: "#e8e4ff", sub: "#7070aa", accent: "#9b7cff"},
  organic: {id: "organic", bg: "#f5f0eb", card: "#fffdf9", border: "#e8e0d5", text: "#2c2416", sub: "#8a7a6a", accent: "#7c9e6e"},
};

const today = () => new Date().toISOString().split("T")[0];

/* ─── COMPOSANT CARTE HYBRIDE ─── */
function SwipeCard({hab, pct, onPct, onEdit, t}) {
  const ref = useRef();
  const dragging = useRef(false);
  const startX = useRef(0);
  const hasMoved = useRef(false);
  const [showQuickMenu, setShowQuickMenu] = useState(false);

  // Gestion du glissement
  const apply = clientX => {
    const rect = ref.current?.getBoundingClientRect();
    if (!rect) return;
    const newPct = Math.max(0, Math.min(100, Math.round(((clientX - rect.left) / rect.width) * 100 / 5) * 5));
    onPct(newPct);
  };

  const onPD = e => {
    dragging.current = true;
    startX.current = e.clientX;
    hasMoved.current = false;
    ref.current?.setPointerCapture(e.pointerId);
  };

  const onPM = e => {
    if (!dragging.current) return;
    if (!hasMoved.current && Math.abs(e.clientX - startX.current) > 15) {
      hasMoved.current = true;
      setShowQuickMenu(false); // Ferme le menu si on glisse
    }
    if (hasMoved.current) apply(e.clientX);
  };

  const onPU = e => {
    dragging.current = false;
    ref.current?.releasePointerCapture(e.pointerId);
  };

  // Actions au clic (Tap)
  const toggleComplete = (e) => {
    e.stopPropagation();
    onPct(pct === 100 ? 0 : 100);
  };

  const toggleMenu = (e) => {
    e.stopPropagation();
    setShowQuickMenu(!showQuickMenu);
  };

  return (
    <div style={{marginBottom: 12}}>
      <div 
        ref={ref}
        onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU}
        style={{
          position: "relative", borderRadius: 18, overflow: "hidden", background: t.card,
          border: `1.5px solid ${pct === 100 ? hab.color : t.border}`,
          cursor: "pointer", touchAction: "pan-y"
        }}
      >
        {/* Barre de progression en fond */}
        <div style={{
          position: "absolute", inset: 0, width: `${pct}%`, 
          background: `${hab.color}${pct === 100 ? '44' : '22'}`, 
          transition: hasMoved.current ? "none" : "width 0.3s"
        }}/>
        
        <div style={{position: "relative", padding: "14px 16px", display: "flex", alignItems: "center", gap: 12}}>
          {/* TAP SUR L'ICONE = 0 ou 100% */}
          <div 
            onClick={toggleComplete}
            style={{
              width: 42, height: 42, borderRadius: "50%", 
              background: pct === 100 ? hab.color : "transparent",
              border: `2px solid ${pct === 100 ? hab.color : t.sub}`,
              display: "flex", alignItems: "center", justifyContent: "center", 
              fontSize: 18, pointerEvents: "all"
            }}
          >
            {pct === 100 ? "✓" : hab.emoji}
          </div>

          {/* TAP SUR LE TEXTE = MENU RAPIDE */}
          <div onClick={toggleMenu} style={{flex: 1, pointerEvents: "all"}}>
            <div style={{fontWeight: 700, fontSize: 15, color: t.text}}>{hab.name}</div>
            <div style={{fontSize: 12, color: t.sub, marginTop: 2}}>
                {pct === 100 ? <span style={{color: hab.color, fontWeight: 600}}>Terminé</span> : `${pct}%`}
            </div>
          </div>

          <button onClick={(e) => {e.stopPropagation(); onEdit();}} style={{background: "none", border: "none", color: t.sub, fontSize: 18, pointerEvents: "all"}}>✎</button>
        </div>
      </div>

      {/* MENU RAPIDE (S'affiche au clic sur le texte) */}
      {showQuickMenu && (
        <div style={{
          display: "flex", justifyContent: "space-between", marginTop: 8, 
          padding: "0 10px", animation: "popIn 0.2s ease-out"
        }}>
          {[0, 25, 50, 75, 100].map(val => (
            <button 
              key={val} 
              onClick={() => { onPct(val); setShowQuickMenu(false); }}
              style={{
                background: pct === val ? hab.color : t.card,
                color: pct === val ? "#fff" : t.text,
                border: `1px solid ${t.border}`,
                padding: "6px 10px", borderRadius: 10, fontSize: 12, fontWeight: 600
              }}
            >
              {val}%
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ─── APP PRINCIPALE ─── */
function App() {
  const [habits, setHabits] = useState(store.get(K.habits) || [{id:"1", name:"Sport", emoji:"💪", color:"#9b7cff"}]);
  const [logs, setLogs] = useState(store.get(K.logs) || {});
  const [themeId, setThemeId] = useState(store.get(K.theme) || "nebula");
  const t = THEMES[themeId];

  const handlePct = (id, val) => {
    const newLogs = {...logs, [today()]: {...(logs[today()] || {}), [id]: val}};
    setLogs(newLogs);
    store.set(K.logs, newLogs);
  };

  return (
    <div style={{background: t.bg, minHeight: "100vh", color: t.text, padding: 20}}>
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 25}}>
        <h1 style={{fontSize: 24, margin: 0}}>Mes Habitudes</h1>
        <button 
            onClick={() => setThemeId(themeId === "nebula" ? "organic" : "nebula")}
            style={{background: t.card, border: "none", color: t.text, padding: "8px 12px", borderRadius: 12}}
        >
          {themeId === "nebula" ? "🌿" : "🌌"}
        </button>
      </div>

      {habits.map(h => (
        <SwipeCard 
          key={h.id} 
          hab={h} 
          pct={logs[today()]?.[h.id] || 0} 
          onPct={(v) => handlePct(h.id, v)} 
          onEdit={() => alert('Option edition')} 
          t={t} 
        />
      ))}
      
      <p style={{textAlign: "center", fontSize: 12, color: t.sub, marginTop: 40}}>
        Astuce : Appuyez sur l'icône pour terminer,<br/>ou sur le nom pour choisir la progression.
      </p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
